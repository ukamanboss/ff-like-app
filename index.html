<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UK FF Likes App</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #ec4899;
            --secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(236, 72, 153, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.15), transparent 40%);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-weight: 800;
            font-size: 28px;
            margin: 0;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-submit:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(236, 72, 153, 0.3); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* Loader Animation */
        .loader {
            width: 20px; height: 20px;
            border: 3px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: none;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* User Info Section (Connected to TG) */
        .user-badge {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 20px;
            padding: 10px; background: rgba(0,0,0,0.3);
            border-radius: 50px; font-size: 14px; font-weight: 600;
        }
        .user-badge img { width: 30px; height: 30px; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>UK FF LIKES 🚀</h1>
            <p>Premium Auto-Like Injector</p>
        </div>

        <div id="userBadge" class="user-badge" style="display: none;">
            <!-- Rendered via JS -->
        </div>

        <div class="glass-card">
            <form id="likeForm">
                <div class="input-group">
                    <label>Free Fire UID</label>
                    <input type="number" id="uid" placeholder="Enter Target UID" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label>Server Region</label>
                    <select id="region">
                        <option value="ind">🇮🇳 India (IND)</option>
                        <option value="sg">🇸🇬 Singapore (SG)</option>
                        <option value="br">🇧🇷 Brazil (BR)</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <span class="loader" id="loader"></span>
                    <span id="btnText">SEND LIKES 🔥</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Make it full screen
        
        // Match Theme Colors Automatically
        document.documentElement.style.setProperty('--bg-color', tg.backgroundColor || '#0f172a');
        document.documentElement.style.setProperty('--text-main', tg.textColor || '#f8fafc');

        // Show User Name dynamically
        if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const badge = document.getElementById('userBadge');
            badge.style.display = 'flex';
            badge.innerHTML = `👤 Connected as: <span>${user.first_name}</span>`;
        }

        // Form Submit Handler
        document.getElementById('likeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const uid = document.getElementById('uid').value;
            const region = document.getElementById('region').value;

            if(!uid) return;

            // Trigger UI Loading State
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btnText');

            btn.disabled = true;
            loader.style.display = 'block';
            btnText.innerText = 'PROCESSING...';
            
            // Haptic Feedback for premium feel
            tg.HapticFeedback.impactOccurred('heavy');

            // Simulate slight processing delay for animation, then send data back to Python Bot
            setTimeout(() => {
                const dataObj = { action: "send_likes_miniapp", uid: uid, region: region };
                tg.sendData(JSON.stringify(dataObj));
                // Telegram API automatically closes the web app after sendData
            }, 1200);
        });
    </script>
</body>
</html>
